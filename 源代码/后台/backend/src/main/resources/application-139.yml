  # 服务器基础URL，用于生成文件的绝对地址传给Dify
  base-url: http://127.0.0.1:8080

spring:
  application:
    name: equipment-repair-system
  
  # PostgreSQL数据源 (线上)
  datasource:
    url: jdbc:postgresql://192.168.110.107:5432/repair_db
    username: postgres
    password: difyai123456
    driver-class-name: org.postgresql.Driver

  # Redis配置 (本地Docker)
  data:
    redis:
      host: localhost
      port: 6379
      database: 4

  
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# MyBatis-Plus配置
