  base-url: http://192.168.110.24:8080
  
spring:
  application:
    name: equipment-repair-system
  
  # PostgreSQL数据源 (线上)
  datasource:
    url: jdbc:postgresql://192.168.110.107:5432/repair_db
    username: postgres
    password: difyai123456
    driver-class-name: org.postgresql.Driver
  
  # Redis配置 (本地Docker)
  data:
    redis:
      host: localhost
      port: 6379
      database: 4
     

  # 文件上传配置
