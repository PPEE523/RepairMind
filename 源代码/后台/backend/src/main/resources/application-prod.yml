# JWT配置
jwt:
  secret: difyai1234567890abcdefghijklmnopqrstuvwxyz123456
  expire-hours: 24

# 文件上传目录
upload:
  dir: ./uploads
  # 视频文件大小限制（MB）
  max-video-size-mb: 50

# 日志配置
# 数据传输加密配置（生产环境开启）
crypto:
  enabled: false
  secret-key: EquipmentRepair2026SecretKey!@#$


# 多模态检索对话配置
chat:
  api-key: app-xbTbMRQvUTEYc3RkondVxbwT
  max-rounds: 10
  max-file-size-mb: 50
  allowedImageTypes: jpg,jpeg,png
  allowed-video-types: mp4
