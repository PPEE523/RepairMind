server:
  port: 8080
  # 服务器基础URL，用于生成文件的绝对地址传给Dify
  base-url: ${SERVER_BASE_URL:http://127.0.0.1:8080}

spring:
  application:
    name: equipment-repair-system
  
  # PostgreSQL数据源 (线上)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/repair_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:difyai123456}
    driver-class-name: org.postgresql.Driver
  
  # Redis配置 (本地Docker)
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:difyai123456}
      database: ${SPRING_DATA_REDIS_DATABASE:7}
  
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.equipment.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Dify平台配置 (dify-spring-boot-starter)
dify:
  url: http://127.0.0.1:3000
  dataset:
    api-key: dataset-fzQHmDfXpDukf9HRk9uvg3Mk
    id: b4ae60fa-d748-4259-b569-0366b31aff20
    case-id: f663c7d0-d7af-4204-85e8-8da462f5f2f5
    # 按模块的可见知识库白名单（逗号分隔），配置后前端无需感知具体ID
    visible-ids:
      knowledge-management: efc5881e-45ac-49f3-a268-52b08235b0a8,b4ae60fa-d748-4259-b569-0366b31aff20
      case-audit: f663c7d0-d7af-4204-85e8-8da462f5f2f5
      sop-workflow: efc5881e-45ac-49f3-a268-52b08235b0a8
  status:
    # 作业指引
    zyzy-api-key: app-pjk71BAwKVT97FqJjDvLzcdh
    # 诊断检测
    zdjc-api-key: app-xbTbMRQvUTEYc3RkondVxbwT
    dataset-api-key: dataset-fzQHmDfXpDukf9HRk9uvg3Mk
  # SOP流程生成与测试（SOP功能新增）
