networks:
  app-net:
    driver: bridge

services:
  backend:
    build:
      context: ../../../源代码/后台/backend
      dockerfile: Dockerfile
    image: biz-backend:base
    container_name: biz-backend
    restart: always
    networks: [app-net]
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      SERVER_BASE_URL: ${SERVER_BASE_URL:-http://host.docker.internal:8080}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://host.docker.internal:5432/repair_db}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD must be set in .env}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-host.docker.internal}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD:-}
      SPRING_DATA_REDIS_DATABASE: ${SPRING_DATA_REDIS_DATABASE:-4}
    volumes:
      - ./config:/app/config
      - ./logs/backend:/app/logs
      - ./volumes/uploads:/app/uploads

  frontend:
    build:
      context: ../../../源代码/前端
      dockerfile: Dockerfile
    image: biz-frontend:base
    container_name: biz-frontend
    restart: always
    networks: [app-net]
    depends_on:
      - backend
    ports:
      - "80:80"